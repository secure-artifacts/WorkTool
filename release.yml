name: Release Windows App

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build App
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "task-organizer" `
            --collect-all PyQt6 `
            --collect-all PIL `
            --hidden-import=pyautogui `
            --hidden-import=pyperclip `
            --hidden-import=cv2 `
            --hidden-import=markdown `
            --hidden-import=pandas `
            --hidden-import=openpyxl `
            main.py

      - name: Package Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_release | Out-Null
          Compress-Archive -Path "dist/task-organizer/*" -DestinationPath "dist_release/task-organizer-windows.zip" -Force

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist_release/task-organizer-windows.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_release/task-organizer-windows.zip
          generate_release_notes: true
